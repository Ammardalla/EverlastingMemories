
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Everlasting Memories</title>
    <script>
      const basePath = "/EverlastingMemories";
      const currentLocation = window.location;

      const path = currentLocation.pathname.startsWith(basePath)
        ? currentLocation.pathname.slice(basePath.length)
        : currentLocation.pathname;

      const redirectUrl =
        basePath +
        "/?p=" +
        encodeURIComponent(path + currentLocation.search) +
        currentLocation.hash;

      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
