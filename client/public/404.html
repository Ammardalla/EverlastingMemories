
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Everlasting Memories</title>
    <script>
      const segmentCount = 1;
      const location = window.location;
      const path = location.pathname
        .split("/")
        .slice(segmentCount + 1)
        .join("/");

      const query = location.search;
      const hash = location.hash;

      location.replace(
        location.origin +
        "/EverlastingMemories/" +
        "?p=/" + path.replace(/&/g, "~and~") +
        (query ? "&q=" + encodeURIComponent(query.slice(1)) : "") +
        hash
      );
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
